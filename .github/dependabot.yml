version: 2
updates:
- package-ecosystem: pip
  directory: "/src"
  schedule:
    interval: weekly
  # no "[skip ci]": dependency bumps must run the checks (a lone PyQt6-WebEngine bump vs PyQt6 must show red)
  commit-message:
    prefix: "deps"
  open-pull-requests-limit: 10
  allow:
    # Allow both direct and indirect updates for all packages
    - dependency-type: "all"
